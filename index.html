<html>
    <head>
       <link rel="stylesheet" href="index.css">
       <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Smythe&display=swap" rel="stylesheet">
    </head>

    <body>
        <header class="hero-img"> 
            <div class="text-container">
                <h1 class="title">Jimmy’s Diner</h1>
                <h2 class="subtitle">The best burgers and pizzas in town.</h2>
            </div>
        </header>
        <main>  
            <section class="menu-section">
                <div id="menu-container" class="menu-container">
                    <!-- Menu items will be rendered here -->
                </div>
            </section>
            <section class="checkout-section">  
                <div id="checkout-container" class="checkout-container hidden">
                    <h1 class="space">Your order</h1>
                    <div id="checkout-section" > 
                             <!-- Checkout details will be rendered here -->
                    </div>
                    <div class="total">
                        <h2 class="checkout-total-title">Total price:</h2>
                        <div id="checkout-total-price" class="checkout-total-price">$0</div>
                    </div>
                    <button id="complete-order-btn" class="complete-order-btn">Complete order</button>
                </div> 
            </section>
            <form id="login-form" class="login-form hidden">
                <h2 class="title-form">Enter card details</h2>
                <input 
                type="text" 
                id="username" 
                ame="username" 
                placeholder="Enter your name"
                class="input-field"
                required>
                <input 
                type="text" 
                id="card-num" 
                name="card-num"
                placeholder="Enter card number"
                class="input-field"
                required>
                <input type="text" 
                id="cvv-num" 
                name="cvv-num"
                placeholder="Enter CVV"
                class="input-field"
                required>
                <button class="form-btn" type="submit">Pay</button>
            </form>

            

        

	<script src="index.js" type="module"></script>
    </body>
</html>
